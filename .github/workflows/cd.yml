name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy on Ubuntu server
        run: |
          cd ~/taskflow-devops
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build
          docker compose ps
          curl -f http://localhost/api/health