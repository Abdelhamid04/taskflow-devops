name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend syntax
        working-directory: backend
        run: node --check server.js

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build backend Docker image
        run: docker build --file backend/Dockerfile --tag taskflow-backend:ci backend

      - name: Scan backend Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-backend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

      - name: Build frontend Docker image
        run: docker build --file frontend/Dockerfile --tag taskflow-frontend:ci frontend

      - name: Scan frontend Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table