name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Node.js
      # =========================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # =========================
      # Frontend
      # =========================
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Snyk Security Scan (Frontend)
        uses: snyk/actions/node@master
        with:
          command: test
          args: --file=frontend/package.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # =========================
      # Backend
      # =========================
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Snyk Security Scan (Backend)
        uses: snyk/actions/node@master
        with:
          command: test
          args: --file=backend/package.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Check backend syntax
        working-directory: backend
        run: node --check server.js

      # =========================
      # SonarQube
      # =========================
      - name: Test SonarQube connection
        run: |
          echo "Testing SonarQube connection..."
          curl -I --max-time 15 "$SONAR_HOST_URL/api/system/status"
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # =========================
      # Docker Compose
      # =========================
      - name: Validate Docker Compose configuration
        run: docker compose config

      # =========================
      # Backend Docker
      # =========================
      - name: Build backend Docker image
        run: docker build --file backend/Dockerfile --tag taskflow-backend:ci backend

      - name: Scan backend Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow-backend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

      # =========================
      # Frontend Docker
      # =========================
      - name: Build frontend Docker image
        run: docker build --file frontend/Dockerfile --tag taskflow-frontend:ci frontend

      - name: Scan frontend Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table